name: Build Yuhuo Storefront V3.1 Compact Cards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: dujiao-next/dujiao-next
          ref: d2e44618de03068cbbe874a23a6d7c6a249a79ec

      - name: Apply reviewed storefront, localization, and compact-card patch
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, subprocess
          patch = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(patch).hexdigest() == "43156b5ae61f8bb4f331d95954350ec866869ef38ecd9dc0feaac66f830f81f3"
          subprocess.run(["git", "apply", "--check"], input=patch, check=True)
          subprocess.run(["git", "apply"], input=patch, check=True)
          PYCODE

      - uses: docker/setup-buildx-action@v3

      - name: Build and test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yuhuo-shop:storefront-v3.1-compact-cards
          build-args: APP_VERSION=v1.4.8-yuhuo-storefront3.1-compact-cards

      - name: Export image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          docker save yuhuo-shop:storefront-v3.1-compact-cards | gzip -1 > artifact/yuhuo-storefront-v3.1-compact-cards.tar.gz
          cd artifact
          sha256sum yuhuo-storefront-v3.1-compact-cards.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: yuhuo-storefront-v3.1-compact-cards-image
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
