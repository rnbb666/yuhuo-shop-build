name: Build Yuhuo Storefront V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: dujiao-next/dujiao-next
          ref: d2e44618de03068cbbe874a23a6d7c6a249a79ec
      - name: Apply reviewed storefront patch
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,subprocess
          patch=gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(patch).hexdigest()=="7d8f78f9ad34ac8d9cc9c05c313afd7ff5ccfa57ca1615e0d9b72684338b0d2c"
          subprocess.run(["git","apply","--check"],input=patch,check=True)
          subprocess.run(["git","apply"],input=patch,check=True)
          PYCODE
      - uses: docker/setup-buildx-action@v3
      - name: Build and test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yuhuo-shop:storefront-v2
          build-args: APP_VERSION=v1.4.8-yuhuo-storefront2
      - name: Export image and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          docker save yuhuo-shop:storefront-v2 | gzip -1 > artifact/yuhuo-storefront-v2.tar.gz
          cd artifact
          sha256sum yuhuo-storefront-v2.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: yuhuo-storefront-v2-image
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
